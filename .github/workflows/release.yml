name: Release win-ifuse

on:
  push:
    tags:
      - "v*"
env:
  LIBPLIST_VER: "2.7.0"
  LIBTATSU_VER: "1.0.5"
  LIBIMOBILEDEVICE_GLUE_VER: "1.3.2"
  LIBIMOBILEDEVICE_VER: "1.4.0"
  LIBUSBMUXD_VER: "2.1.1"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            coreutils
            base-devel
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-curl
            make
            libtool
            autoconf
            automake-wrapper
            zip
          msystem: MINGW64

      - name: Install WinFsp
        shell: pwsh
        run: |
          choco install winfsp -y
          refreshenv

      - name: Build libimobiledevice suite (versioned tarballs)
        run: |
          set -euo pipefail
          workspace="$PWD"
          tmp="$PWD/_tmp_libs"
          mkdir -p "$tmp"
          cd "$tmp"

          base_url="https://github.com/libimobiledevice"

          libs=("libplist" "libimobiledevice-glue" "libusbmuxd" "libtatsu" "libimobiledevice" )

          for name in "${libs[@]}"; do
            ver_var=$(echo "${name^^}_VER" | sed 's/-/_/g')
            ver="${!ver_var:-}"
            if [ -z "$ver" ]; then
              echo "Version for $name not set (env var $ver_var)"
              exit 1
            fi

            archive="${name}-${ver}.tar.bz2"
            url="${base_url}/${name}/releases/download/${ver}/${archive}"
            echo "=== Processing $name $ver ==="
            echo "URL: $url"
            curl -L -o "$archive" "$url"

            echo "Extracting $archive"
            tar xjf "$archive"

            srcdir="${name}-${ver}"
            pushd "$srcdir"

            ./configure --without-cython
            make -j"$(nproc)"
            make install
            popd
            echo "Installed $name $ver"
          done

          # cleanup
          cd "$workspace"
          rm -rf "$tmp"

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DPACKAGE_VERSION="${{ github.ref_name }}"

      - name: Build the project
        run: cmake --build build

      - name: Zip the build output with install script
        run: |
          cp install-win-fsp.bat build/dist/
          cd build/dist
          zip -r ../win-ifuse-${{ github.ref_name }}.zip *

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/win-ifuse-${{ github.ref_name }}.zip
          asset_name: win-ifuse-${{ github.ref_name }}.zip
          tag: ${{ github.ref }}
          overwrite: true
          body: |
            $(git log -1 --pretty=format:"%h - %s (%an, %ad)" --date=short)
